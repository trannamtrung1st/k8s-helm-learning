# Cluster overlay for Helm `-f` (local kind / dev machine). Merged AFTER
# devops/platform/values/global-values.yaml — later file wins.
#
# Supplies connection strings left empty in the platform layer.
# Credentials here are LOCAL-ONLY placeholders; do not reuse for shared clusters.
#
# See: devops/README.md
global:
  workbenchStorageClasses:
    pvc:
      name: standard
  workbenchPostgres:
    connectionString: Host=workbench-postgres-db.workbench-db.svc.cluster.local;Port=5432;Database=workbench;Username=workbench;Password=workbench
    user: workbench
    password: workbench
    database: workbench
  workbenchRabbitMq:
    user: workbench
    password: workbench
    uri: amqp://workbench:workbench@workbench-rabbitmq.workbench-infra.svc.cluster.local:5672/
  workbenchRedis:
    user: workbench
    password: workbench
    cluster:
      enabled: true
      replicas: 6
      masters: 3
      replicasPerMaster: 1

# local-kind overlay — lean replicas (fits small clusters; was 5 API / 2 worker)
# Infra charts use `replicas`; app charts use `replicaCount`.
workbench-rabbitmq:
  replicas: 3

workbench-public-gateway:
  serviceType: ClusterIP
  httpsListener:
    hostname: api.k8slearning.com

workbench-api:
  replicaCount: 2
  environment: local-kind
  topologySpread:
    enabled: true
    maxSkew: 1
    minDomains: 2

workbench-api-v2:
  replicaCount: 1
  environment: local-kind
  topologySpread:
    enabled: true
    maxSkew: 1
    minDomains: 2

workbench-worker:
  replicaCount: 1
  environment: local-kind

workbench-app:
  replicaCount: 1
  environment: local-kind
  config:
    apiBaseUrl: http://localhost:8080/api/wb

workbench-policies:
  workbenchWorkerNetworkPolicy:
    enabled: true
