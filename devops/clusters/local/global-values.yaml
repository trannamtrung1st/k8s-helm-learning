# Cluster overlay for Helm `-f` (local kind / dev machine). Merged AFTER
# devops/platform/values/global-values.yaml — later file wins.
#
# Supplies connection strings left empty in the platform layer.
# Credentials here are LOCAL-ONLY placeholders; do not reuse for shared clusters.
#
# See: devops/README.md
global:
  workbenchPostgres:
    connectionString: Host=workbench-postgres-db.workbench-db.svc.cluster.local;Port=5432;Database=workbench;Username=workbench;Password=workbench
    user: workbench
    password: workbench
    database: workbench
  workbenchRabbitMq:
    uri: amqp://workbench:workbench@workbench-rabbitmq.workbench-infra.svc.cluster.local:5672/
  workbenchRedis:
    connectionString: workbench-redis.workbench-infra.svc.cluster.local:6379,user=workbench,password=workbench
    user: workbench
    password: workbench

# local-kind overlay equivalents (formerly k8s/apps/*/overlays/local-kind)
workbench-api:
  replicaCount: 5
  environment: local-kind
  topologySpread:
    enabled: true

workbench-worker:
  replicaCount: 2
  environment: local-kind

workbench-app:
  replicaCount: 1
  environment: local-kind
  config:
    apiBaseUrl: http://localhost:8080/api
