# Cluster overlay for AKS — 3x Standard_D2s_v3 (2 vCPU, 4 GiB per node).
# Merged after devops/platform/values/global-values.yaml.
#
# Budget (~schedulable after AKS system pods): ~3.5 CPU / ~9 GiB cluster-wide.
# This overlay keeps total requests near ~1.2 CPU / ~1.8 GiB so pods can spread.
#
# Install:
#   ./scripts/helm-apply.sh --cluster aks
#
# global.workbenchPostgres / workbenchRabbitMq / workbenchRedis below use CHANGEME
# placeholders for lint/template. helm-apply.sh merges real values from Key Vault
# (terraform output key_vault_name) as the final -f overlay unless --skip-kv-secrets is set.

global:
  workbenchStorageClasses:
    pvc:
      name: managed-csi
  workbenchPostgres:
    connectionString: Host=workbench-postgres-db.workbench-db.svc.cluster.local;Port=5432;Database=workbench;Username=workbench;Password=CHANGEME
    user: workbench
    password: CHANGEME
    database: workbench
  workbenchRabbitMq:
    user: workbench
    password: CHANGEME
    uri: amqp://workbench:CHANGEME@workbench-rabbitmq.workbench-infra.svc.cluster.local:5672/
  workbenchRedis:
    user: workbench
    password: CHANGEME
    cluster:
      enabled: true
      replicas: 6
      masters: 3
      replicasPerMaster: 1

workbench-public-gateway:
  serviceType: LoadBalancer

workbench-api:
  replicaCount: 2
  environment: aks
  topologySpread:
    enabled: true
    maxSkew: 1
    minDomains: 2

workbench-worker:
  replicaCount: 1
  environment: aks

workbench-app:
  replicaCount: 1
  environment: aks
  config:
    apiBaseUrl: /api/wb

workbench-policies:
  workbenchLimitRange:
    defaultCpuLimit: 500m
    defaultCpuRequest: 50m
    maxCpuLimit: 1
  workbenchResourceQuota:
    requestsCpu: 2
    requestsMemory: 3Gi
    limitsCpu: 3
    limitsMemory: 4Gi
