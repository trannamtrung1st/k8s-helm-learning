apiVersion: v2
name: workbench-namespaces
description: |
  Declares Workbench Namespace resources and standard labels.

  Required (merged via -f; see devops/helm/README.md):
    - global.workbenchPartOf (non-empty string)
    - global.workbenchNamespaces (non-empty map of role → { name, purpose })

  Example:
    helm upgrade --install namespaces devops/helm/platform/namespaces/ -f devops/helm/platform/values/global-values.yaml -f devops/helm/clusters/local/global-values.yaml
type: application
version: 1.0.0-rc1
appVersion: "1.0.0-rc1"
