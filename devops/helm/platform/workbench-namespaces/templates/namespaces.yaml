{{- /* Namespace list from .Values.global (direct install and umbrella subcharts). */ -}}
{{- $g := .Values.global | default dict -}}
{{- $_ := required "workbench-namespaces: set global.workbenchPartOf (same -f chain). See Chart description and values.yaml." $g.workbenchPartOf -}}
{{- $namespaces := $g.workbenchNamespaces -}}
{{- if eq (len (keys $namespaces)) 0 -}}
{{- fail "workbench-namespaces: global.workbenchNamespaces must contain at least one namespace entry." -}}
{{- end -}}
{{ $workbenchPartOf := $g.workbenchPartOf }}
{{ range $k := keys $namespaces | sortAlpha }}
{{ with $namespace := index $namespaces $k }}
{{ include "platform.namespaces.namespace" (
    dict
        "name" .name
        "partOf" $workbenchPartOf
        "purpose" .purpose
        "Release" $.Release
        "Chart" $.Chart
) }}
---
{{ end }}
{{ end }}
