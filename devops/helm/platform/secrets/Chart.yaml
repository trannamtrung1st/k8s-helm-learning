apiVersion: v2
name: workbench-apps-secrets
description: |
  Opaque Secret for apps (RabbitMQ URI, Redis connection string) in the apps namespace.

  Required merged values (see devops/helm/README.md):
    - Layer (1): -f devops/helm/platform/values/global-values.yaml
    - Layer (2): -f devops/helm/clusters/<cluster>/global-values.yaml
      with non-empty global.workbenchRabbitMq.uri and global.workbenchRedis.connectionString.

  `values.schema.json` rejects lint/template until both layers are applied.
type: application
version: 1.0.0-rc1
appVersion: "1.0.0-rc1"
