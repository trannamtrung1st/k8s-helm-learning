name: workbench-app
component: frontend
instance: workbench-app
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench/workbench-app
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-app-config
config:
  # Browser-reachable API URL (e.g. port-forward workbench-api to :8080).
  apiBaseUrl: http://localhost:8080/api
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
