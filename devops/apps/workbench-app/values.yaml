name: workbench-app
component: frontend
instance: workbench-app
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench-app
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-app-config
config:
  # Browser-reachable API URL via gateway (port-forward workbench-public-gateway-istio :8080).
  apiBaseUrl: http://localhost:8080/api/wb
httpRoute:
  enabled: true
  annotations: {}
  labels: {}
  parentRefs:
    - name: workbench-public-gateway
      namespace: istio-system
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - port: 80
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
