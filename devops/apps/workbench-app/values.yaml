name: workbench-app
component: frontend
instance: workbench-app
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench-app
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-app-config
config:
  # Browser-reachable API URL via gateway (port-forward workbench-public-gateway-istio :8080).
  apiBaseUrl: http://localhost:8080/api/wb
httpRoute:
  enabled: true
  parentGatewayName: workbench-public-gateway
  parentGatewayNamespace: istio-system
  # Both listeners; HTTP→HTTPS redirect for k8slearning.com is a separate platform route.
  parentSectionNames:
    - http
    - https
  hostname: ""
  pathPrefix: /
  pathMatchType: PathPrefix
  pathRewrites:
    - matchPath: /secret-home
      matchPathType: PathPrefix
      rewritePath: /
  pathRedirects:
    - matchPath: /home
      matchPathType: Exact
      redirectPath: /
      statusCode: 303
resources:
  limitsCpu: 200m
  limitsMemory: 128Mi
  requestsCpu: 50m
  requestsMemory: 64Mi
