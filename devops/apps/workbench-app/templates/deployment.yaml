apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.lib.namespace.apps" . }}
  labels:
    {{- include "workbench.lib.labels.standard.apps" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "workbench.lib.labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workbench.lib.labels.pod" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config-map.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: runtime-config
          configMap:
            name: {{ .Values.configMap.name }}
      containers:
        - name: {{ .Values.name }}
          image: {{ include "workbench.lib.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              protocol: TCP
              containerPort: 80
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          resources:
            {{- include "workbench.lib.resources.container" .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
