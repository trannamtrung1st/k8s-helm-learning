name: workbench-worker
component: worker
instance: workbench-worker
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench-worker
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-worker-config
secrets:
  name: workbench-worker-secrets
resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
