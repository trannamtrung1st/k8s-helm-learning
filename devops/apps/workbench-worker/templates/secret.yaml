apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "workbench.lib.namespace.apps" . }}
  labels:
    {{- include "workbench.lib.labels.standard.apps" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__Default: {{ required "workbench-worker: set global.workbenchPostgres.connectionString (cluster -f overlay)." .Values.global.workbenchPostgres.connectionString }}
