apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.lib.namespace.apps" . }}
  labels:
    {{- include "workbench.lib.labels.standard.cronjob" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  timeZone: {{ .Values.timeZone }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
      parallelism: 1
      completions: 1
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "workbench.lib.labels.standard.cronjob" . | nindent 12 }}
          annotations:
            checksum/secrets: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        spec:
          containers:
            - name: cleanup-jobs
              image: {{ include "workbench.lib.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - cleanup-old-jobs
                - --older-than-days
                - {{ .Values.cleanup.olderThanDays | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              envFrom:
                - secretRef:
                    name: {{ .Values.secrets.name }}
          restartPolicy: OnFailure
