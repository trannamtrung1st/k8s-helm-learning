name: workbench-api
component: api
instance: workbench-api
replicaCount: 1
workbench:
  version: "1.0.0"
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench-api
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-api-config
secrets:
  name: workbench-api-secrets
httpRoute:
  enabled: true
  parentGatewayName: workbench-public-gateway
  parentGatewayNamespace: istio-system
  # Both listeners; HTTP→HTTPS redirect for api.k8slearning.com is a separate platform route.
  parentSectionNames:
    - http
    - https
  hostname: ""
  pathPrefix: /api/wb
  pathMatchType: PathPrefix
  pathRewrites:
    - matchPath: /swagger
      matchPathType: PathPrefix
      rewritePath: /api/wb/swagger
  # Optional weighted traffic split (overrides default single-service backend).
  # backendRefs:
  #   - name: workbench-api
  #     port: 80
  #     weight: 50
  #   - name: workbench-api-v2
  #     port: 80
  #     weight: 50
  # Gateway API rule timeouts (request must be >= backendRequest when both are set).
  # timeouts:
  #   request: "10s"
  #   backendRequest: "8s"
  cors:
    allowOrigins:
      - "http://localhost"
      - "http://localhost:8080"
      - "http://localhost:8081"
      - "https://localhost"
      - "https://localhost:8080"
      - "http://k8slearning.com"
      - "https://k8slearning.com"
      - "http://*.k8slearning.com"
      - "https://*.k8slearning.com"
    allowMethods:
      - "*"
    allowHeaders:
      - "*"
    allowCredentials: false
  headers:
    request:
      set:
        - name: x-purpose
          value: k8s-learning
    response:
      set:
        - name: x-purpose
          value: k8s-learning
topologySpread:
  enabled: false
  maxSkew: 1
  minDomains: 2
resources:
  limitsCpu: 300m
  limitsMemory: 256Mi
  requestsCpu: 100m
  requestsMemory: 128Mi
