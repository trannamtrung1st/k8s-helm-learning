name: workbench-api
component: api
instance: workbench-api
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench-api
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-api-config
secrets:
  name: workbench-api-secrets
httpRoute:
  enabled: true
  parentGatewayName: workbench-public-gateway
  parentGatewayNamespace: istio-system
  # Both listeners; HTTP→HTTPS redirect for k8slearning.com is a separate platform route.
  parentSectionNames:
    - http
    - https
  hostname: ""
  pathPrefix: /api/wb
  pathMatchType: PathPrefix
  pathRewrites:
    - matchPath: /swagger
      matchPathType: PathPrefix
      rewritePath: /api/wb/swagger
  headers:
    request:
      set:
        - name: x-purpose
          value: k8s-learning
    response:
      set:
        - name: x-purpose
          value: k8s-learning
topologySpread:
  enabled: false
  maxSkew: 1
  minDomains: 2
resources:
  limitsCpu: 300m
  limitsMemory: 256Mi
  requestsCpu: 100m
  requestsMemory: 128Mi
