name: workbench-api
component: api
instance: workbench-api
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench-api
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-api-config
secrets:
  name: workbench-api-secrets
httpRoute:
  enabled: true
  annotations: {}
  labels: {}
  parentRefs:
    - name: workbench-public-gateway
      namespace: istio-system
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/wb
      backendRefs:
        - port: 80
topologySpread:
  enabled: false
  maxSkew: 1
  minDomains: 2
resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
