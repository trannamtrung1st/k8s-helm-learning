name: workbench-api
component: api
instance: workbench-api
replicaCount: 1
revisionHistoryLimit: 5
environment: ""
image:
  repository: workbench/workbench-api
  tag: 1.0.0-rc1
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: http
configMap:
  name: workbench-api-config
secrets:
  name: workbench-api-secrets
topologySpread:
  enabled: false
  maxSkew: 1
  minDomains: 2
resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
