apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.redis.namespace" . }}
  labels:
    {{- include "workbench.redis.labels.standard" . | nindent 4 }}
spec:
  selector:
    {{- include "workbench.redis.labels.selector" . | nindent 4 }}
  ports:
    - name: redis-port
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis-port
  type: ClusterIP
  clusterIP: None
