apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.lib.namespace.infra" . }}
  labels:
    {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "cache") | nindent 4 }}
spec:
  selector:
    {{- include "workbench.lib.labels.selector.nameOnly" . | nindent 4 }}
  ports:
    - name: redis-port
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis-port
  type: ClusterIP
  clusterIP: None
