{{- $redis := .Values.global.workbenchRedis | default dict -}}
{{- $cliUser := required "workbench-redis: set global.workbenchRedis.user (cluster -f overlay)." $redis.user -}}
{{- $cliPassword := required "workbench-redis: set global.workbenchRedis.password (cluster -f overlay)." $redis.password -}}
{{- $cluster := $redis.cluster | default dict -}}
{{- $clusterEnabled := $cluster.enabled | default false -}}
{{- $replicas := .Values.replicas -}}
{{- if $clusterEnabled }}
{{- $replicas = int (include "workbench.lib.redis.replicas" .) -}}
{{- end -}}
{{- $svcName := include "workbench.lib.redis.name" . -}}
{{- $infraNs := include "workbench.lib.namespace.infra" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.lib.namespace.infra" . }}
  labels:
    {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "cache") | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "workbench.lib.labels.selector.nameOnly" . | nindent 6 }}
  serviceName: {{ .Values.name | quote }}
  replicas: {{ $replicas }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  template:
    metadata:
      labels:
        {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "cache") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Values.name }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          {{- if $clusterEnabled }}
          command:
            - redis-server
            - /etc/redis/workbench.conf
            - --cluster-announce-hostname
            - $(POD_NAME).{{ $svcName }}.{{ $infraNs }}.svc.cluster.local
            - --cluster-announce-port
            - {{ .Values.service.port | quote }}
            - --cluster-announce-bus-port
            - {{ .Values.service.clusterBusPort | quote }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- else }}
          command: ["redis-server", "/etc/redis/workbench.conf"]
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: redis-port
            {{- if $clusterEnabled }}
            - containerPort: {{ .Values.service.clusterBusPort }}
              name: redis-bus
            {{- end }}
          volumeMounts:
            - name: {{ .Values.secrets.name }}
              mountPath: /etc/redis
              readOnly: true
            {{- if $clusterEnabled }}
            - name: redis-data
              mountPath: /data
            {{- end }}
          imagePullPolicy: IfNotPresent
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - redis-cli
                - --user
                - {{ $cliUser }}
                - -a
                - {{ $cliPassword }}
                - ping
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - --user
                - {{ $cliUser }}
                - -a
                - {{ $cliPassword }}
                - ping
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --user
                - {{ $cliUser }}
                - -a
                - {{ $cliPassword }}
                - ping
            {{- toYaml .Values.probes.readiness | nindent 12 }}
      volumes:
        - name: {{ .Values.secrets.name }}
          secret:
            secretName: {{ .Values.secrets.name }}
        {{- if $clusterEnabled }}
        - name: redis-data
          emptyDir: {}
        {{- end }}
