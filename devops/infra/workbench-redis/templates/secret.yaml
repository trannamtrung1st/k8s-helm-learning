{{- $redis := .Values.global.workbenchRedis | default dict -}}
{{- $user := required "workbench-redis: set global.workbenchRedis.user (cluster -f overlay)." $redis.user -}}
{{- $password := required "workbench-redis: set global.workbenchRedis.password (cluster -f overlay)." $redis.password -}}
{{- $cluster := $redis.cluster | default dict -}}
{{- $clusterEnabled := $cluster.enabled | default false -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "workbench.lib.namespace.infra" . }}
  labels:
    {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "cache") | nindent 4 }}
type: Opaque
stringData:
  workbench.conf: |
    appendonly no
    bind 0.0.0.0
    protected-mode no
{{- if $clusterEnabled }}
    cluster-enabled yes
    cluster-node-timeout 5000
    cluster-config-file /data/nodes.conf
    cluster-require-full-coverage no
    masteruser {{ $user }}
    masterauth {{ $password }}
{{- end }}
    user default off
    user {{ $user }} on >{{ $password }} ~* &* +@all
