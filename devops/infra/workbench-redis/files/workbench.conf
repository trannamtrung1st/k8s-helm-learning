# Workbench Redis — reference for Docker Compose and legacy Kustomize (secretGenerator).
# Helm renders workbench.conf from global.workbenchRedis (see templates/secret.yaml).
# Cluster mode adds cluster-* and masteruser/masterauth for replica→master replication.

appendonly no
bind 0.0.0.0
protected-mode no

user default off
user workbench on >workbench ~* &* +@all
