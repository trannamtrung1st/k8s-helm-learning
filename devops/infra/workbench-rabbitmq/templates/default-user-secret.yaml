{{- /* Operator uses a pre-created Secret named <RabbitmqCluster>-default-user instead of generating credentials. */ -}}
{{- $rmq := .Values.global.workbenchRabbitMq | default dict -}}
{{- $user := required "workbench-rabbitmq: set global.workbenchRabbitMq.user (cluster -f overlay)." $rmq.user -}}
{{- $pass := required "workbench-rabbitmq: set global.workbenchRabbitMq.password (cluster -f overlay)." $rmq.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-default-user
  namespace: {{ include "workbench.lib.namespace.infra" . }}
  labels:
    {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "broker") | nindent 4 }}
type: Opaque
stringData:
  username: {{ $user | quote }}
  password: {{ $pass | quote }}
  default_user.conf: |
    default_user = {{ $user }}
    default_pass = {{ $pass }}
