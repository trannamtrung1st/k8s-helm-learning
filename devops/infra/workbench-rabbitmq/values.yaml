name: workbench-rabbitmq
configMap:
  name: workbench-rabbitmq-definitions
image:
  repository: rabbitmq
  tag: 4-management-alpine
replicas: 3
minReadySeconds: 20
terminationGracePeriodSeconds: 60
definitions:
  confFileName: 10-workbench-definitions.conf
  confMountPath: /etc/rabbitmq/conf.d/10-workbench-definitions.conf
  jsonFileName: definitions.json
  jsonMountPath: /etc/rabbitmq/definitions/definitions.json
probes:
  command:
    - rabbitmq-diagnostics
    - -q
    - ping
  startup:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
# RabbitMQ requires at least 1 CPU (request and limit). Do not reduce below 1 CPU.
resources:
  limitsCpu: "1"
  limitsMemory: 512Mi
  requestsCpu: "1"
  requestsMemory: 512Mi
pvc:
  size: 512Mi
  # storageClassName: set via global.workbenchStorageClasses.pvc.name (local=standard, aks=managed-csi)
