{{- $pg := .Values.global.workbenchPostgres | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "workbench.postgres.namespace" . }}
  labels:
    {{- include "workbench.postgres.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "workbench-postgres: set global.workbenchPostgres.user (cluster -f overlay)." $pg.user }}
  POSTGRES_PASSWORD: {{ required "workbench-postgres: set global.workbenchPostgres.password (cluster -f overlay)." $pg.password }}
  POSTGRES_DB: {{ required "workbench-postgres: set global.workbenchPostgres.database (cluster -f overlay)." $pg.database }}
