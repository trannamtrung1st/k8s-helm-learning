apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.lib.namespace.db" . }}
  labels:
    {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "workbench.lib.labels.selector.nameOnly" . | nindent 6 }}
  serviceName: {{ .Values.name | quote }}
  replicas: {{ .Values.replicas }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  template:
    metadata:
      labels:
        {{- include "workbench.lib.labels.standard.infra" (dict "ctx" . "component" "database") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config-map.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Values.name }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: db-port
          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}
            - secretRef:
                name: {{ .Values.secrets.name }}
          volumeMounts:
            - name: {{ .Values.name }}-volume
              mountPath: {{ .Values.data.mountPath | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            {{- include "workbench.lib.resources.container" .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ required "workbench-postgres: set global.workbenchPostgres.user (cluster -f overlay)." .Values.global.workbenchPostgres.user }}
                - -d
                - {{ required "workbench-postgres: set global.workbenchPostgres.database (cluster -f overlay)." .Values.global.workbenchPostgres.database }}
            {{- include "workbench.lib.probe.timing" .Values.probes.startup | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ required "workbench-postgres: set global.workbenchPostgres.user (cluster -f overlay)." .Values.global.workbenchPostgres.user }}
                - -d
                - {{ required "workbench-postgres: set global.workbenchPostgres.database (cluster -f overlay)." .Values.global.workbenchPostgres.database }}
            {{- include "workbench.lib.probe.timing" .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ required "workbench-postgres: set global.workbenchPostgres.user (cluster -f overlay)." .Values.global.workbenchPostgres.user }}
                - -d
                - {{ required "workbench-postgres: set global.workbenchPostgres.database (cluster -f overlay)." .Values.global.workbenchPostgres.database }}
            {{- include "workbench.lib.probe.timing" .Values.probes.readiness | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.name }}-volume
      spec:
        accessModes:
          - ReadWriteOncePod
        storageClassName: {{ include "workbench.lib.storageClasses.pvcName" . | quote }}
        resources:
          requests:
            storage: {{ .Values.pvc.size }}
