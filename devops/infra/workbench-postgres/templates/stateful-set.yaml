apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "workbench.postgres.namespace" . }}
  labels:
    {{- include "workbench.postgres.labels.standard" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "workbench.postgres.labels.selector" . | nindent 6 }}
  serviceName: {{ .Values.name | quote }}
  replicas: {{ .Values.replicas }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  template:
    metadata:
      labels:
        {{- include "workbench.postgres.labels.standard" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Values.name }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: db-port
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          volumeMounts:
            - name: {{ .Values.name }}-volume
              mountPath: /var/lib/postgresql/data
          imagePullPolicy: IfNotPresent
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ required "workbench-postgres: set global.workbenchPostgres.user (cluster -f overlay)." .Values.global.workbenchPostgres.user }}
                - -d
                - {{ required "workbench-postgres: set global.workbenchPostgres.database (cluster -f overlay)." .Values.global.workbenchPostgres.database }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ required "workbench-postgres: set global.workbenchPostgres.user (cluster -f overlay)." .Values.global.workbenchPostgres.user }}
                - -d
                - {{ required "workbench-postgres: set global.workbenchPostgres.database (cluster -f overlay)." .Values.global.workbenchPostgres.database }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.name }}-volume
      spec:
        accessModes:
          - ReadWriteOncePod
        storageClassName: {{ .Values.pvc.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.pvc.size }}
