name: workbench-postgres-db
image:
  repository: postgres
  tag: "16-alpine"
replicas: 1
revisionHistoryLimit: 3
minReadySeconds: 20
terminationGracePeriodSeconds: 60
service:
  port: 5432
data:
  mountPath: /var/lib/postgresql
  pgdataPath: /var/lib/postgresql/pgdata
probes:
  startup:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
# Burstable QoS — sized for small nodes (e.g. AKS Standard_D2s_v3).
resources:
  limitsCpu: 500m
  limitsMemory: 512Mi
  requestsCpu: 200m
  requestsMemory: 384Mi
pvc:
  size: 1Gi
pv:
  name: workbench-postgres-db-volume
  storageClassName: local-storage
  capacity: 1Gi
  path: /mnt/disks/workbench-postgres-db
secrets:
  name: workbench-postgres-db-secrets
  # user, password, database: set via global.workbenchPostgres in cluster global-values.yaml
configMap:
  name: workbench-postgres-db-config
