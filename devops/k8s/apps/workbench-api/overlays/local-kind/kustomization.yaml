# Local kind cluster: lean replicas, env labels. Load image first:
#   docker build -t workbenchacr77.azurecr.io/workbench-api:1.0.0-rc1 -f src/Workbench.Api/Dockerfile src
#   kind load docker-image workbenchacr77.azurecr.io/workbench-api:1.0.0-rc1 --name workbench-0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workbench-apps
resources:
  - ../../base
replicas:
  - name: workbench-api
    count: 2
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      workbench.io/environment: local-kind
