# Build with: kubectl kustomize . | kubectl apply --server-side -f -
# Raw YAML fragments here are incomplete alone (no namespace/labels until kustomize runs).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workbench-apps

labels:
  - pairs:
      app.kubernetes.io/name: workbench-worker
      app.kubernetes.io/component: worker
    includeSelectors: true
  - pairs:
      app.kubernetes.io/instance: workbench-worker
      app.kubernetes.io/version: 1.0.0-rc1
      app.kubernetes.io/part-of: workbench
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true

replicas:
  - name: workbench-worker
    count: 1

images:
  - name: workbench/workbench-worker
    newTag: 1.0.0-rc1

resources:
  - config-map.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
