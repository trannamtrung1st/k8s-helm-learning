# Local kind cluster: lean replicas, env labels. Load image first:
#   docker build -t workbench/workbench-worker:1.0.0-rc1 -f src/Workbench.Worker/Dockerfile src
#   kind load docker-image workbench/workbench-worker:1.0.0-rc1 --name workbench-0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workbench-system
resources:
  - ../../base
replicas:
  - name: workbench-worker
    count: 2
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      workbench.io/environment: local-kind
