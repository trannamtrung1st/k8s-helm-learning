# Dev / learning defaults — replace with sealed secrets, External Secrets, or CI injection for real clusters.
apiVersion: v1
kind: Secret
metadata:
  name: workbench-platform-secrets
  namespace: workbench-system
  labels:
    app.kubernetes.io/name: workbench-platform-secrets
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: workbench
