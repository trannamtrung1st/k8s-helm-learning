apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workbench-infra

resources:
  - statefulset.yaml
  - service.yaml

# Mirrors devops/redis (Kustomize only allows file sources under this directory).
secretGenerator:
  - name: workbench-redis-secrets
    files:
      - workbench.conf=redis/workbench.conf
