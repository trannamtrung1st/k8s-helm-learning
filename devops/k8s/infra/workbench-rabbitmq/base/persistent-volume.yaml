# Static volume name, no dynamic provisioning.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbench-rabbitmq-volume
spec:
  capacity:
    storage: 512Mi
  accessModes:
    - ReadWriteOncePod
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain # no deletion on PVC deletion
  local:
    path: /mnt/disks/workbench-rabbitmq
  # Requires node label workbench.io/infra-node=true (see devops/k8s/README.md).
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workbench.io/infra-node
              operator: In
              values:
                - "true"
