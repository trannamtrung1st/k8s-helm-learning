apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workbench-postgres-db
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: workbench-postgres-db
  serviceName: "workbench-postgres-db"
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbench-postgres-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: workbench
        app.kubernetes.io/managed-by: kustomize
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: workbench-postgres-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: db-port
          envFrom:
            - secretRef:
                name: workbench-postgres-db-secrets
          volumeMounts:
            - name: workbench-postgres-db-volume
              mountPath: /var/lib/postgresql/data
          imagePullPolicy: IfNotPresent
          resources: # QoS: Burstable (small-node friendly)
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 384Mi
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "workbench", "-d", "workbench"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "workbench", "-d", "workbench"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: workbench-postgres-db-volume
      spec:
        # volumeName: workbench-postgres-db-volume # static volume name, no dynamic provisioning
        accessModes: ["ReadWriteOncePod"]
        storageClassName: "standard"
        resources:
          requests:
            storage: 1Gi
