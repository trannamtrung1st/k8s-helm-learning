apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbench-postgres-db-volume
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOncePod
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain # no deletion on PVC deletion
  local:
    path: /mnt/disks/workbench-postgres-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Equals
              values:
                - workbench-0-control-plane
