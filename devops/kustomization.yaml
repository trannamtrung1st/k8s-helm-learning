# DEPRECATED: prefer Helm for full-stack installs.
#
#   ./scripts/helm-apply.sh
#
# Legacy Kustomize entrypoint (manifests under k8s/). Kept for reference and
# gradual migration; new changes belong in devops/ (Helm charts).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply from repository root: kubectl apply --server-side --force-conflicts -k devops
# (or ./scripts/k8s-apply.sh). Manifests live under k8s/; shared broker/cache files
# are sourced from infra/workbench-rabbitmq/files/ and infra/workbench-redis/files/.

resources:
  - k8s/platform/namespaces
  - k8s/platform/storage-classes
  - k8s/platform/secrets
  - k8s/platform/policies

  - k8s/infra/workbench-postgres-db/base
  - k8s/infra/workbench-rabbitmq/base
  - k8s/infra/workbench-redis/base

  - k8s/apps/workbench-api/overlays/local-kind
  - k8s/apps/workbench-worker/overlays/local-kind
  - k8s/apps/workbench-jobs/overlays/local-kind

configMapGenerator:
  - name: workbench-rabbitmq-definitions
    namespace: workbench-infra
    options:
      disableNameSuffixHash: true
    files:
      - definitions.json=infra/workbench-rabbitmq/files/definitions.json
      - 10-workbench-definitions.conf=infra/workbench-rabbitmq/files/conf.d/10-workbench-definitions.conf

secretGenerator:
  - name: workbench-redis-secrets
    namespace: workbench-infra
    options:
      disableNameSuffixHash: true
    files:
      - workbench.conf=infra/workbench-redis/files/workbench.conf
