# Umbrella defaults. Cluster overlays: devops/clusters/<cluster>/global-values.yaml
# Platform values: devops/platform/platform-values/global-values.yaml (required for gateway part-of label).

workbench-public-gateway:
  enabled: true

workbench-http-routes:
  httpToHttpsRedirect:
    enabled: true

workbench-api:
  httpRoute:
    enabled: true
    timeouts:
      request: "10s"
      backendRequest: "8s"
    backendRefs:
      - name: workbench-api
        port: 80
        weight: 50
      - name: workbench-api-v2
        port: 80
        weight: 50

workbench-api-v2:
  name: workbench-api-v2
  instance: workbench-api-v2
  replicaCount: 1
  workbench:
    version: "2.0.0"
  configMap:
    name: workbench-api-v2-config
  secrets:
    name: workbench-api-v2-secrets
  httpRoute:
    enabled: false

workbench-app:
  httpRoute:
    enabled: true
