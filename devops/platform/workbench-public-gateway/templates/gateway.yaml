{{- if .Values.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    networking.istio.io/service-type: {{ .Values.serviceType }}
{{- include "workbench-public-gateway.certManagerAnnotations" . | nindent 4 }}
  labels:
    {{- include "workbench-public-gateway.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    {{- if .Values.httpListener.enabled }}
    - name: {{ .Values.httpListener.name }}
      protocol: HTTP
      port: {{ .Values.httpListener.port }}
      {{- with .Values.httpListener.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        {{- include "workbench-public-gateway.allowedRoutes" . | nindent 8 }}
    {{- end }}
    {{- range .Values.httpsListeners }}
    {{- if .enabled }}
    - name: {{ .name }}
      protocol: HTTPS
      port: {{ .port }}
      {{- with .hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- with $.Values.tlsSecretName }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ . }}
            kind: Secret
            group: ""
      {{- end }}
      allowedRoutes:
        {{- include "workbench-public-gateway.allowedRoutes" $ | nindent 8 }}
    {{- end }}
    {{- end }}
{{- end }}
