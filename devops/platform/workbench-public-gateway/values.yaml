# Installed via workbench-umbrella (./scripts/helm-apply.sh). Standalone:
#   helm upgrade --install workbench-public-gateway . -n workbench-platform \
#   -f ../platform-values/global-values.yaml -f ../../clusters/local/global-values.yaml
#
# Istio annotates the generated Service from this Gateway. Use ClusterIP on kind
# (port-forward); use LoadBalancer on cloud clusters.

enabled: true

name: workbench-public-gateway
namespace: istio-system
component: gateway
gatewayClassName: istio

# HTTPRoutes: only namespaces with app.kubernetes.io/part-of=<global.workbenchPartOf>
# (set in template; requires -f ../platform-values/global-values.yaml).

# Merged with standard chart labels in templates/gateway.yaml.
labels: {}

# Istio Gateway Service type (kind/local: ClusterIP; AKS: often LoadBalancer).
serviceType: ClusterIP

httpListener:
  enabled: true
  name: http
  port: 80
  # hostname omitted → accept all hostnames

httpsListeners:
  - name: https-wildcard
    enabled: true
    hostname: "*.k8slearning.com"
    port: 443
  - name: https-localhost
    enabled: true
    hostname: localhost
    port: 443

tlsSecretName: workbench-public-gateway-tls

# cert-manager Certificate settings for the HTTPS listeners.
# https://cert-manager.io/docs/usage/gateway/
# dnsNames are derived from httpsListeners hostnames; commonName is set explicitly.
certManager:
  commonName: "*.k8slearning.com"
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days before expiry
  usages: "digital signature,key encipherment,server auth"
  privateKeyAlgorithm: ECDSA
  privateKeySize: "256"
  privateKeyRotationPolicy: Always
  extraAnnotations: {}
