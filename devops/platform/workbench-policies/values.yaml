# Sample NetworkPolicy (roadmap item 27). Opt-in: requires a CNI that enforces NetworkPolicy.
# Denies all ingress to workbench-worker; allows all egress to workbench-infra (RabbitMQ, Redis).
# Worker also uses Postgres in workbench-db and cluster DNS — extend before enabling in production.
workbenchWorkerNetworkPolicy:
  enabled: false
  name: workbench-worker-sample
  workerName: workbench-worker

workbenchLimitRange:
  name: workbench-limit-range
  defaultCpuLimit: 500m
  defaultCpuRequest: 50m
  maxCpuLimit: 1

workbenchRabbitMqPdb:
  name: workbench-rabbitmq-pdb
  maxUnavailable: 1

# Apps namespace only — sized for ~3x Standard_D2s_v3 AKS (override in clusters/aks/).
workbenchResourceQuota:
  name: workbench-resource-quota
  requestsCpu: 2
  requestsMemory: 3Gi
  limitsCpu: 3
  limitsMemory: 4Gi
