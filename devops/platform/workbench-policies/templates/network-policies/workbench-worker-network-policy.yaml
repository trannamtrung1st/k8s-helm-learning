{{- if .Values.workbenchWorkerNetworkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.workbenchWorkerNetworkPolicy.name }}
  namespace: {{ .Values.global.workbenchNamespaces.apps.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.workbenchPartOf }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workbenchWorkerNetworkPolicy.workerName }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to: # [IMPORTANT] CoreDNS lives in kube-system; podSelector alone only matches same namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.global.workbenchNamespaces.infra.name }}
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.global.workbenchNamespaces.db.name }}
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.global.workbenchNamespaces.storage.name }}
{{- end }}
