# Helm values for cert-manager install.
# Used by: ./scripts/cert-manager-install.sh
# Gateway API CRDs are installed separately (./scripts/gateway-api-install.sh or e2e step 2a/4a).
crds:
  enabled: true

# Delete TLS secrets when their Certificate is deleted (controller --enable-certificate-owner-ref).
enableCertificateOwnerRef: true

config:
  enableGatewayAPI: true
  # ListenerSet (cert-manager 1.20+, Gateway API v1.5+). Gateway/ListenerSet resources added separately.
  enableGatewayAPIListenerSet: true
  featureGates:
    ListenerSets: true
