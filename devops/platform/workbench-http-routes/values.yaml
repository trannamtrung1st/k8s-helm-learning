# Installed via workbench-umbrella (./scripts/helm-apply.sh). Standalone:
#   helm upgrade --install workbench-http-routes . -n workbench-platform \
#   -f ../platform-values/global-values.yaml -f ../../clusters/local/global-values.yaml
#
# Each key under this file maps to a template in templates/ (add routes as needed).

httpToHttpsRedirect:
  enabled: true
  name: workbench-http-to-https-redirect
  component: gateway-route
  parentGatewayName: workbench-public-gateway
  parentGatewayNamespace: istio-system
  httpListenerName: http
  hostname: api.k8slearning.com
  redirect:
    scheme: https
    statusCode: 301
