{{- if .Values.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.global.workbenchNamespaces.platform.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: {{ .Values.component }}
    app.kubernetes.io/part-of: {{ .Values.global.workbenchPartOf }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  parentRefs:
    - name: {{ .Values.parentGatewayName }}
      namespace: {{ .Values.parentGatewayNamespace }}
      sectionName: {{ .Values.httpListenerName }}
  hostnames:
    - {{ required "workbench-http-to-https-redirect: set hostname" .Values.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ .Values.redirect.scheme }}
            statusCode: {{ .Values.redirect.statusCode }}
{{- end }}
