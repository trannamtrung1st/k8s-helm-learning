# Installed via workbench-umbrella (./scripts/helm-apply.sh). Standalone:
#   helm upgrade --install workbench-http-to-https-redirect . -n workbench-platform \
#   -f ../../values/global-values.yaml -f ../../../clusters/local/global-values.yaml
#
# Attaches to the HTTP listener only. Redirect applies solely to the configured
# hostname (default api.k8slearning.com); other hostnames (e.g. localhost port-forward)
# are unaffected. App HTTPRoutes attach to both http and https listeners.

enabled: true

name: workbench-http-to-https-redirect
component: gateway-route

parentGatewayName: workbench-public-gateway
parentGatewayNamespace: istio-system
httpListenerName: http

hostname: api.k8slearning.com

redirect:
  scheme: https
  statusCode: 301
