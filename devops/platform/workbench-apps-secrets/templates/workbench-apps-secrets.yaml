{{- $redis := .Values.global.workbenchRedis | default dict -}}
{{- $cluster := $redis.cluster | default dict -}}
{{- $clusterEnabled := $cluster.enabled | default false -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.workbenchSecrets.apps.name }}
  namespace: {{ .Values.global.workbenchNamespaces.apps.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.workbenchSecrets.apps.name }}
    app.kubernetes.io/component: {{ .Values.global.workbenchComponents.platform.name }}
    app.kubernetes.io/part-of: {{ .Values.global.workbenchPartOf }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  RabbitMq__Uri: {{ .Values.global.workbenchRabbitMq.uri | b64enc }}
{{- if $clusterEnabled }}
  Redis__Cluster__Enabled: {{ "true" | b64enc }}
  Redis__User: {{ required "workbench-apps-secrets: set global.workbenchRedis.user" $redis.user | b64enc }}
  Redis__Password: {{ required "workbench-apps-secrets: set global.workbenchRedis.password" $redis.password | b64enc }}
{{- $replicas := int ($cluster.replicas | default 3) }}
{{- range $i := until $replicas }}
  Redis__Endpoints__{{ $i }}: {{ include "workbench.lib.redis.endpoint" (dict "Values" $.Values "ordinal" $i) | b64enc }}
{{- end }}
{{- else }}
  Redis__ConnectionString: {{ required "workbench-apps-secrets: set global.workbenchRedis.connectionString (or enable global.workbenchRedis.cluster)" $redis.connectionString | b64enc }}
{{- end }}
