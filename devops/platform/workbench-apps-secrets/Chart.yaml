apiVersion: v2
name: workbench-apps-secrets
description: |
  Opaque Secret for apps (RabbitMQ URI, Redis connection string) in the apps namespace.

  Required merged values (see devops/README.md):
    - Layer (1): -f devops/platform/values/global-values.yaml
    - Layer (2): -f devops/clusters/<cluster>/global-values.yaml
      with non-empty global.workbenchRabbitMq.uri and global.workbenchRedis (standalone
      connectionString or cluster.enabled with user/password).

  `values.schema.json` rejects lint/template until both layers are applied.
type: application
version: 1.0.0-rc1
appVersion: "1.0.0-rc1"
dependencies:
  - name: workbench-common
    version: 1.0.0-rc1
    repository: file://../workbench-common
