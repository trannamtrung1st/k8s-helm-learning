# Full stack: infra + workbench-local-gateway (YARP), workbench-api, workbench-worker, workbench-app
# Browser/API entry: localhost:8080 (/api/* → API, /swagger → Swashbuckle). API has no host port.
# Run from repo root: docker compose -f local/docker-compose.yaml up --build
#
# App services use image tag 1.0.0-rc1 (bump when releasing). `image` + `build` tags the local build.
# Backend build context: ../src (Workbench.*). Frontend: ../src/workbench-app.

name: workbench

include:
  - path: ./docker-compose.infra.yaml

services:
  workbench-api:
    image: workbenchacr77.azurecr.io/workbench-api:1.0.0-rc1
    platform: linux/amd64
    build:
      context: ../src
      dockerfile: Workbench.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=workbench;Username=workbench;Password=workbench
      RabbitMq__Uri: amqp://workbench:workbench@rabbitmq:5672/
      Redis__ConnectionString: redis:6379,user=workbench,password=workbench
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - workbench

  workbench-local-gateway:
    depends_on:
      workbench-api:
        condition: service_started

  workbench-worker:
    image: workbenchacr77.azurecr.io/workbench-worker:1.0.0-rc1
    platform: linux/amd64
    build:
      context: ../src
      dockerfile: Workbench.Worker/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=workbench;Username=workbench;Password=workbench
      RabbitMq__Uri: amqp://workbench:workbench@rabbitmq:5672/
      Redis__ConnectionString: redis:6379,user=workbench,password=workbench
    ports:
      - "8082:80"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      workbench-api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - workbench

  workbench-jobs:
    image: workbenchacr77.azurecr.io/workbench-jobs:1.0.0-rc1
    platform: linux/amd64
    build:
      context: ../src
      dockerfile: Workbench.Jobs/Dockerfile
    environment:
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=workbench;Username=workbench;Password=workbench
    command: ["cleanup-old-jobs", "--older-than-days", "2"]
    restart: "no"
    profiles:
      - jobs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench

  workbench-app:
    image: workbenchacr77.azurecr.io/workbench-app:1.0.0-rc1
    platform: linux/amd64
    build:
      context: ../src/workbench-app
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      workbench-local-gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - workbench
